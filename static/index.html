<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Rush Counter POS — Concept Demo</title>
<style>
:root{--bg:#fff8f2;--sf:#fff;--tx:#2b2a2c;--mu:#6e6a6d;--pk:#c2255c;--pl:#fde4ec;--bd:#eadfd8;--ok:#1e8e4e;--okl:#e3f4ea;--wn:#b36b00;--wl:#fff1d6;--er:#c92a2a;--up:#4c3fb3;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1a1b;--sf:#272425;--tx:#f4efed;--mu:#b2aaad;--pk:#ff7aa8;--pl:#3b2430;--bd:#3a3536;--ok:#5fd08a;--okl:#1f3a2a;--wn:#ffb84d;--wl:#3d2f12;--er:#ff8787;--up:#a79bff;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
button,input,select{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:8px 12px;min-height:52px}button:active{filter:brightness(.93)}button:disabled{opacity:.4;cursor:not-allowed}
input,select{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;min-height:52px;width:100%}
.pri{background:var(--pk);color:#fff;border-color:var(--pk);font-weight:700}
#app{position:relative;display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
#top{display:flex;align-items:center;gap:12px;padding:6px 12px;background:var(--sf);border-bottom:1px solid var(--bd);flex:none}
#top .n{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
nav{display:flex;gap:6px}nav button{min-height:52px;min-width:92px;font-weight:600}nav .on{background:var(--pk);color:#fff;border-color:var(--pk)}
.st{display:flex;gap:16px;margin-left:auto;font-size:13px;color:var(--mu);text-align:right;line-height:1.2}.st b{color:var(--tx);font-size:18px}
#v{flex:1;min-height:0;overflow:auto}#v.rcv{overflow:hidden}
#note{flex:none;font-size:11px;color:var(--mu);text-align:center;padding:3px 8px calc(3px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--bd)}
/* counter */
.rc{display:grid;grid-template-columns:148px minmax(0,1fr) 340px;height:100%}
@media(min-width:1180px){.rc{grid-template-columns:172px minmax(0,1fr) 390px}}
.rail{display:flex;flex-direction:column;gap:8px;padding:10px 8px;overflow-y:auto;background:var(--sf);border-right:1px solid var(--bd)}
.rail button{min-height:64px;font-weight:700;font-size:15px;line-height:1.15;text-align:left}.rail .on{background:var(--pk);color:#fff;border-color:var(--pk)}
.mid{display:flex;flex-direction:column;min-height:0;padding:10px 12px 0}
.mid input{flex:none;min-height:52px;margin-bottom:8px}
.hint{flex:none;font-size:12px;color:var(--mu);margin:0 0 6px}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));grid-auto-rows:min-content;gap:10px;padding-bottom:12px;align-content:start}
.t{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px 10px;min-height:136px;border-radius:14px}
.ti{width:100%;height:42px;display:flex;align-items:center;font-size:32px;line-height:1}.ti img{height:42px;max-width:100%;object-fit:cover;border-radius:8px}
.tn{font-size:16px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.3em}
.tp{color:var(--pk);font-weight:800;font-size:20px}.ts{font-size:13px;color:var(--mu)}
.t.low{border-color:var(--wn);background:var(--wl)}.t.low .ts{color:var(--wn);font-weight:700}
.t.off{opacity:.5;background:var(--bg);cursor:not-allowed}.t.off .ts{color:var(--er);font-weight:800}
.tq{position:absolute;top:6px;right:6px;min-width:28px;height:28px;border-radius:99px;background:var(--pk);color:#fff;font-style:normal;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 7px}.t.in .tq{display:flex}
.t.pop{animation:pop .16s}@keyframes pop{50%{transform:scale(.95);background:var(--pl)}}
/* bill */
.bill{display:flex;flex-direction:column;min-height:0;background:var(--sf);border-left:1px solid var(--bd)}
.bh{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bd)}.bh b{font-size:18px;margin-right:auto}.bh button{min-height:48px}
#last{display:none;margin:8px 10px 0;padding:8px 10px;background:var(--okl);color:var(--ok);border-radius:12px;font-weight:700;align-items:center;gap:8px;justify-content:space-between;font-size:14px}
.lines{flex:1;min-height:0;overflow-y:auto;padding:0 10px}.empty{color:var(--mu);padding:18px 4px;text-align:center}
.ln{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--bd);align-items:center}
.ln .nm{font-weight:700;font-size:16px;line-height:1.15}.ln .lt{font-weight:800;font-size:17px}
.qc{display:flex;align-items:center;gap:6px}.qc button{width:54px;min-height:52px;padding:0;font-size:24px}.qc b{min-width:30px;text-align:center;font-size:20px}
.ln .rm{justify-self:end;min-height:52px;width:54px;padding:0;color:var(--er)}
.bf{padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd)}
.sub{display:flex;justify-content:space-between;color:var(--mu);font-size:14px}.tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:38px;line-height:1.1;margin:2px 0 8px}.tot span:first-child{font-size:18px;color:var(--mu);font-weight:600}
.pay{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.pay button{min-height:76px;font-weight:800;font-size:18px;color:#fff;border:0}
.pc{background:var(--ok)}.pu{background:var(--up)}.ps{background:var(--wn)}
/* other views */
.pg{padding:12px 14px 20px;max-width:1280px;margin:auto}.panel{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.mu{color:var(--mu)}.low{color:var(--wn);font-weight:700}.bad{color:var(--er)}.good{color:var(--ok)}
h2,h3{margin:0 0 8px}h3{font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}.chips button{white-space:nowrap;border-radius:99px;min-height:48px}.chips .on{background:var(--pk);color:#fff;border-color:var(--pk)}
.sg{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
.sr{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.sr .q{font-size:26px;font-weight:800;min-width:60px;text-align:right}
.qa{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}.qa button{min-height:52px;min-width:70px;font-weight:700}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.kp div{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px}.kp b{font-size:26px;display:block}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.fm .w{grid-column:1/-1}.fm label{display:block;font-size:13px;color:var(--mu);margin-bottom:3px}
.seg{display:flex;gap:8px}.seg button{flex:1}.seg .on{background:var(--pk);color:#fff;border-color:var(--pk);font-weight:700}
.lg{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}#md.on{display:flex}
.box{background:var(--sf);border-radius:18px;padding:18px;width:100%;max-width:460px;max-height:94vh;overflow:auto}
.box label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}.box .big{font-size:34px;font-weight:800}
#tt{position:fixed;left:50%;transform:translateX(-50%);bottom:40px;background:#2b2a2c;color:#fff;padding:10px 18px;border-radius:99px;z-index:60;display:none;font-weight:600;max-width:90vw;text-align:center}#tt.er{background:var(--er)}
.rcpt{background:#fff;color:#000;font-family:monospace;line-height:1.35;padding:6px;margin:0 auto}.rcpt table{width:100%;border-collapse:collapse}.rcpt td{padding:1px 0;vertical-align:top}.rcpt hr{border:0;border-top:1px dashed #000;margin:4px 0}.rcpt .c{text-align:center}.rcpt .r{text-align:right}.rcpt .rw{display:flex;justify-content:space-between}
#pa{display:none}
@media print{body>*:not(#pa){display:none!important}#pa{display:block}#pa .rcpt{width:100%!important;padding:0}html,body{overflow:visible;height:auto}}
.dev{border:12px solid #1f1d1e;border-radius:34px;overflow:hidden;background:#1f1d1e;box-shadow:0 12px 40px rgba(0,0,0,.35)}#sh{padding:10px 12px;overflow:auto;height:100%}.shb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.shb .on{background:var(--pk);color:#fff;border-color:var(--pk);font-weight:700}
#mbar,#bd,.bill .x{display:none}
#app{height:100dvh}
@media(max-width:820px){
html,body{overscroll-behavior:none}
#top{flex-wrap:wrap;gap:2px 8px;padding:6px 10px 6px}
#top .n{font-size:17px;max-width:none;flex:1 1 100%;max-height:30px;overflow:hidden;transition:max-height .2s,opacity .2s}
nav{width:100%}nav button{flex:1;min-width:0;min-height:42px;padding:4px;font-size:14px;transition:min-height .2s,font-size .2s}
.st{display:none}
.rc{display:flex;flex-direction:column}
.rail{flex:none;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:0;padding:6px 10px;gap:6px;-webkit-overflow-scrolling:touch}
.rail button{flex:none;min-height:42px;white-space:nowrap;padding:4px 14px;border-radius:99px;font-size:14px;transition:min-height .2s}
.mid{flex:1;padding:0 10px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;overflow-anchor:none}
.t{min-height:104px;padding:6px 8px 8px}.ti{height:34px;font-size:26px}.ti img{height:34px}.tn{font-size:15px}.tp{font-size:18px}.ts{font-size:12px}
#mbar{display:block;flex:none;padding:6px 10px;background:var(--sf);border-top:1px solid var(--bd)}
#mbar button{width:100%;min-height:50px;font-size:17px}
#bd{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:29;opacity:0;pointer-events:none;transition:opacity .2s}#bd.on{opacity:1;pointer-events:auto}
/* bill = bottom sheet: hidden until the bar is tapped, then slides up */
.bill{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:80vh;max-height:80dvh;border:1px solid var(--bd);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .22s ease,visibility 0s .22s;box-shadow:0 -8px 30px rgba(0,0,0,.35);visibility:hidden}
.bill.open{transform:none;visibility:visible;transition:transform .22s ease,visibility 0s}
.bill .x{display:block}
.bh{padding:6px 10px}.bh button{min-height:44px;padding:4px 10px}
.lines{flex:none;max-height:30vh;overflow-y:auto}
.ln{padding:6px 0}.qc button{width:46px;min-height:44px}.ln .rm{min-height:44px;width:46px}
.sg,.fm{grid-template-columns:1fr}
.tot{font-size:30px}.pay button{min-height:58px;font-size:17px}
#note{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* collapsing header: ONE overlay (title+tabs+categories+search). Scroll area never changes size, so no jitter. */
#app.ctr{padding-top:0}
.rc.m{position:relative}
.rc.m .stack{position:absolute;left:0;right:0;top:0;z-index:15;background:var(--sf);border-bottom:1px solid var(--bd);box-shadow:0 2px 10px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top,0px);overflow:hidden}
.rc.m .stack #top{position:static;border-bottom:0;padding-top:6px}
.rc.m .sx{padding:0 10px;overflow:hidden;max-height:130px;transition:max-height .2s,opacity .2s}
.rc.m .sx input{min-height:46px;margin:4px 0 2px}.rc.m .hint{min-height:18px;margin:0 0 6px}
#app.cmp .rc.m #top .n{max-height:0;opacity:0}
#app.cmp .rc.m nav button{min-height:34px;font-size:13px}
#app.cmp .rc.m .rail button{min-height:34px;font-size:13px;padding:2px 12px}
#app.cmp .rc.m .rail{padding:4px 10px}
#app.cmp .rc.m #top{padding-bottom:2px}
#app.cmp .rc.m .sx{max-height:0;opacity:0}
#app.nt *{transition:none!important}
}
@media(prefers-reduced-motion:reduce){.t.pop{animation:none}}
</style></head><body>
<div id="app"><header id="top"></header><main id="v"></main><div id="note">Independent concept demo — not an official Monginis product, and not connected to or approved by any franchise billing software. UPI/Cash only record the method chosen; no real payment is processed.</div></div>
<div id="pa"></div><div id="md"><div class="box" id="mb"></div></div><div id="tt"></div>
<script>
const LOW=5;
const FR=document.body.dataset.f==='1',SRC=FR?'':'<!DOCTYPE html>'+document.documentElement.outerHTML.replace('<body','<body data-f="1"');
let S={products:[],sales:[],categories:[],printer:{shop_name:'Sweet Counter',paper_mm:58,font_px:12,show_demo_note:true,auto_print:false,footer:'',address:'',phone:'',tax_id:''},pin_required:false};
let view='rush',cat='Popular',q='',cart=[],hist=[],busy=false,ck=null,lastSale=null,dsel='',iq='',ic='All',lowOnly=false,pinTok='',slog=[];
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),M=n=>'₹'+Number(n).toLocaleString('en-IN'),P=id=>S.products.find(p=>p.id==id),dk=t=>new Date(t).toLocaleDateString('en-CA');
function tk(){try{return sessionStorage.getItem('pin')||''}catch(e){return pinTok}}
function setTk(v){pinTok=v;try{sessionStorage.setItem('pin',v)}catch(e){}}
async function api(p,o={}){const h={'Content-Type':'application/json'};if(tk())h['X-Owner-Pin']=tk();const r=await fetch('/api'+p,{...o,headers:h});let j=null;try{j=await r.json()}catch(e){}if(!r.ok){const er=new Error(j&&typeof j.detail=='string'?j.detail:'Please check the values and try again');er.status=r.status;throw er}return j}
async function load(){try{S={...S,...await api('/state')};return true}catch(e){toast('Cannot reach server — check connection',1);return false}}
let tm;function toast(m,e){const t=$('tt');t.textContent=m;t.className=e?'er':'';t.style.display='block';clearTimeout(tm);tm=setTimeout(()=>t.style.display='none',2000)}
function modal(h){$('mb').innerHTML=h;$('md').classList.add('on')}function closeM(){$('md').classList.remove('on')}const modalOpen=()=>$('md').classList.contains('on');
function ask(msg,fn,yes){window._fn=fn;modal(`<p><b>${msg}</b></p><div class="row"><button onclick="closeM()" style="flex:1">Cancel</button><button class="pri" style="flex:1" onclick="closeM();_fn()">${yes||'Yes, continue'}</button></div>`)}
/* ---------- bill logic ---------- */
const total=()=>cart.reduce((a,l)=>a+(P(l.id)?P(l.id).price*l.q:0),0),count=()=>cart.reduce((a,l)=>a+l.q,0),inBill=id=>(cart.find(l=>l.id==id)||{q:0}).q;
const snap=()=>{hist.push(JSON.stringify(cart));if(hist.length>30)hist.shift()};
function fixCart(){const b=JSON.stringify(cart);cart=cart.map(l=>({id:l.id,q:Math.min(l.q,P(l.id)&&P(l.id).on?P(l.id).stock:0)})).filter(l=>l.q>0);return b!=JSON.stringify(cart)}
function add(id){const p=P(id);if(!p||busy)return;if(!p.on||p.stock<=0)return toast(p.name+' is sold out',1);if(inBill(id)>=p.stock)return toast('Only '+p.stock+' in stock',1);snap();const l=cart.find(x=>x.id==id);l?l.q++:cart.push({id,q:1});tile(id,true);cartR()}
function chg(id,d){const p=P(id),l=cart.find(x=>x.id==id);if(!l)return;if(d>0&&l.q>=p.stock)return toast('Only '+p.stock+' in stock',1);snap();l.q+=d;if(l.q<=0)cart=cart.filter(x=>x.id!=id);tile(id);cartR()}
function rm(id){snap();cart=cart.filter(x=>x.id!=id);tile(id);cartR()}
function undo(){if(!hist.length)return toast('Nothing to undo',1);cart=JSON.parse(hist.pop());fixCart();prodR();cartR()}
function clr(){if(cart.length)ask('Clear the whole bill?',()=>{snap();cart=[];prodR();cartR();closeBill()},'Yes, clear')}
function openBill(){$('bill').classList.add('open');$('bd').classList.add('on')}
function closeBill(){const b=$('bill');if(b){b.classList.remove('open');$('bd').classList.remove('on')}}
function rep(){const l=S.sales[S.sales.length-1];if(!l)return toast('No previous bill yet',1);snap();cart=[];l.items.forEach(i=>{const p=P(i.id);if(p&&p.on&&p.stock>0)cart.push({id:i.id,q:Math.min(i.q,p.stock)})});prodR();cartR();toast('Loaded '+l.no)}
/* ---------- header ---------- */
function top_(){const d=dk(Date.now()),s=S.sales.filter(x=>dk(x.t)==d);$('top').innerHTML=`<span class="n">🍰 ${esc(S.printer.shop_name)}</span><nav>${[['rush','Counter'],['inv','Stock'],['sales','Sales'],['set','Printer']].map(n=>`<button class="${view==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}</nav><div class="st"><span>Today<br><b>${M(s.reduce((a,x)=>a+x.total,0))}</b></span><span>Bills<br><b>${s.length}</b></span><span id="clk"></span></div>`;tick()}
function tick(){const c=$('clk');if(c)c.innerHTML=new Date().toLocaleTimeString('en-IN',{timeStyle:'short'})+'<br>'+new Date().toLocaleDateString('en-IN',{dateStyle:'medium'})}setInterval(tick,15000);
async function go(v){if((v=='inv'||v=='set')&&S.pin_required&&!tk())return pinAsk(v);view=v;render()}
function pinAsk(v,msg){modal(`<h2>Owner PIN</h2><p class="mu">Stock and printer settings are for the owner.</p><input id="pn" type="password" inputmode="numeric" autocomplete="off"><p class="bad" id="pe">${msg||''}</p><div class="row"><button style="flex:1" onclick="closeM()">Cancel</button><button class="pri" style="flex:1" onclick="pinOk('${v}')">Unlock</button></div>`);setTimeout(()=>$('pn')&&$('pn').focus(),50)}
async function pinOk(v){setTk($('pn').value.trim());try{await api('/stock-log?limit=1');closeM();view=v;render()}catch(e){setTk('');pinAsk(v,e.status==401?'Wrong PIN.':e.message)}}
/* ---------- counter ---------- */
const emo=p=>{const n=(p.name+' '+p.cat).toLowerCase();return/cupcake/.test(n)?'🧁':/cake/.test(n)?'🎂':/pastry/.test(n)?'🍰':/puff|patty|savour|sandwich/.test(n)?'🥟':/bread|pav|bun/.test(n)?'🍞':/cookie|biscuit/.test(n)?'🍪':/choco/.test(n)?'🍫':/candle/.test(n)?'🕯️':/cap|party|birthday/.test(n)?'🎉':/drink|coffee|tea|juice|shake/.test(n)?'🥤':'🥐'};
function popular(){const m={};S.sales.slice(-80).forEach(s=>s.items.forEach(i=>m[i.id]=(m[i.id]||0)+i.q));let l=Object.keys(m).sort((a,b)=>m[b]-m[a]).map(P).filter(Boolean).slice(0,12),demo=false;if(l.length<8){demo=true;const seen=new Set(l.map(p=>p.id));for(const c of S.categories)for(const p of S.products.filter(x=>x.cat==c&&x.on)){if(!seen.has(p.id)&&l.length<12){l.push(p);seen.add(p.id);}}}return{l,demo}}
function tileH(p){const n=inBill(p.id),off=!p.on||p.stock<=0,low=!off&&p.stock<=LOW;return`<button class="t${off?' off':''}${low?' low':''}${n?' in':''}" data-id="${p.id}"><span class="ti">${p.image?`<img src="${esc(p.image)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${emo(p)}'))">`:emo(p)}</span><b class="tn">${esc(p.name)}</b><span class="tp">${M(p.price)}</span><small class="ts">${!p.on?'SOLD OUT':p.stock<=0?'SOLD OUT':low?'Only '+p.stock+' left':p.stock+' left'}</small><i class="tq">${n||''}</i></button>`}
function tile(id,pop){const b=document.querySelector(`#grid .t[data-id="${id}"]`);if(!b)return;const p=P(id),n=inBill(id);b.classList.toggle('in',n>0);b.querySelector('.tq').textContent=n||'';if(pop){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}}
function list(){const s=q.trim().toLowerCase();if(s)return{l:S.products.filter(p=>(p.name+' '+p.cat).toLowerCase().includes(s))};if(cat=='Popular')return popular();return{l:S.products.filter(p=>cat=='All'||p.cat==cat)}}

function split(){if(!cart.length||busy)return;const t=total();let touched=false;modal(`<h2>Split payment</h2><div class="big">${M(t)}</div><label>Cash (₹)</label><input id="sc" inputmode="numeric" autocomplete="off"><label>UPI (₹)</label><input id="su" inputmode="numeric" autocomplete="off"><div class="row" style="margin:10px 0"><span class="mu">Remaining</span><b id="sr" style="font-size:24px"></b></div><div class="row" style="margin-bottom:10px"><button style="flex:1" id="r1">Rest → Cash</button><button style="flex:1" id="r2">Rest → UPI</button></div><div class="row"><button style="flex:1" onclick="closeM()">Back</button><button class="pri" id="sgo" style="flex:2">Complete Sale</button></div>`);

async function pay(method,extra){if(busy||!cart.length)return;const body={items:cart.map(l=>({id:l.id,q:l.q})),pay:method,...(extra||{})};const sig=JSON.stringify(body);if(!ck||ck.sig!=sig)ck={sig,k:(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random())};
busy=true;cartR();

s.items.forEach(i=>{const p=P(i.id);if(p)p.stock=Math.max(0,p.stock-i.q)});S.sales.push(s);cart=[];hist=[];lastSale=s;busy=false;closeBill();top_();prodR();cartR();showLast();toast('✔ Sale saved — next customer');if(S.printer.auto_print)printReceipt(s);const b0=sig();load().then(()=>{if(view=='rush'&&!busy&&sig()!=b0){fixCart();prodR();cartR();top_()}})}
